timing: True
debug: False
stop_at_error: False

# Evaluates the cluster lensing likelihood at the w0wa point of
# scripts/compare_cluster_lensing.py (expected chi2 = 959.613445)

likelihood:
  roman_real.cluster_lensing:
    path: ./external_modules/data/roman_real
    data_file: cluster_lensing_desy1.dataset
    print_datavector: False
    print_datavector_file: "./projects/roman_real/chains/theory_cluster_lensing.modelvector"

params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.2
    proposal: 0.2
    latex: 10^9 A_\mathrm{s}
    drop: true
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.9649
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 3
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.05
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
    drop: true
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.27
      scale: 0.015
    proposal: 0.015
    latex: \Omega_\mathrm{m}
    drop: true
  w:
    prior:
      min: -3
      max: -0.01
    ref:
      dist: norm
      loc: -0.9
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  w0pwa:
    prior:
      min: -5
      max: -0.01
    ref:
      dist: norm
      loc: -0.6
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    latex: w_{a,\mathrm{DE}}
  mnu:
    value: 0.06
  tau:
    value: 0.0697186
    latex: \tau_\mathrm{reio}
  # ---------------------------------------------------------------------------------------
  # ------------------------------------- DERIVED PARAMETERS ------------------------------
  # ---------------------------------------------------------------------------------------
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  sigma8:
    latex: \sigma_8

theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      kmax: 7.5

sampler:
  evaluate:
    N: 1
    override:
      As_1e9: 2.1
      ns: 0.9649
      H0: 67.32731988349163
      omegab: 0.05
      omegam: 0.27
      w: -0.9
      w0pwa: -0.6
      roman_CL_SIGLOGM_1: 0.3
      roman_CL_LOGMMIN_1: 12.5
      roman_CL_LOGM20_1: 14.5
      roman_CL_ALPHA_1: 1.26
      roman_CL_SIGLOGM_3: 0.3
      roman_CL_LOGMMIN_3: 12.5
      roman_CL_LOGM20_3: 14.5
      roman_CL_ALPHA_3: 1.26
      roman_CL_BARYON_B: -0.5
      roman_CL_FMIS: 0.16
      roman_CL_TAU: 0.16
      roman_CL_AM1: 1.03
      roman_CL_AM2: 1.03
      roman_CL_AM3: 0.97

output: ./projects/roman_real/chains/EXAMPLE_EVALUATE_CLUSTER_LENSING1
