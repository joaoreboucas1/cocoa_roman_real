timing: True
debug: False
stop_at_error: False

# Same as EXAMPLE_MCMC_CLUSTER_LENSING1.yaml, but with the second set of cluster
# nuisance priors (README), from original_code/emcee_cosmo_emu_bin_rich_lens_3bin_
# HOD_evol_ns_fix_v2.py: logMmin in [11.2, 13.4], logM20 in [14.0, 15.2] and
# alpha in [0.5, 2.5]. These override likelihood/params_cluster.yaml.
# MCMC with the cluster lensing likelihood alone, set up to resemble the
# original ns_fix chain (original_code/MCMC_DESY1CL_..._ns_fix_rich10_v5.hdf5):
# LCDM, n_s fixed, theta fixed (H0 derived), Gaussian prior on omega_b h^2.
# Differences from the original: A_s is sampled instead of sigma8 (sigma8 is
# derived), omega_c h^2 is sampled instead of Omega_m (its range maps to
# Omega_m ~ [0.16, 0.42] at fixed theta), CAMB's theta_MC replaces CLASS's
# theta_s (h about 0.003 higher), and the h ~ N(0.70, 0.1) prior is not applied.

likelihood:
  roman_real.cluster_lensing:
    path: ./external_modules/data/roman_real
    data_file: cluster_lensing_desy1.dataset

params:
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.1
      scale: 0.1
    proposal: 0.05
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  ns:
    value: 0.9649
    latex: n_\mathrm{s}
  theta_MC_100:
    value: 1.041533 # 100 theta_s of the original code (CLASS)
    latex: 100\theta_\mathrm{MC}
    drop: true
  cosmomc_theta:
    value: 'lambda theta_MC_100: 1.e-2*theta_MC_100'
    derived: false
  H0:
    latex: H_0
    min: 20
    max: 100
  omegabh2:
    prior:
      dist: norm
      loc: 0.02208
      scale: 0.00052
    ref:
      dist: norm
      loc: 0.02208
      scale: 0.0005
    proposal: 0.0005
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    prior:
      min: 0.085
      max: 0.14
    ref:
      dist: norm
      loc: 0.11
      scale: 0.005
    proposal: 0.005
    latex: \Omega_\mathrm{c} h^2
  mnu:
    value: 0.06
  tau:
    value: 0.0544
    latex: \tau_\mathrm{reio}
  w:
    value: -1.0
    latex: w_{0,\mathrm{DE}}
  wa:
    value: 0.0
    latex: w_{a,\mathrm{DE}}
  # ---------------------------------------------------------------------------------------
  # ------------------- CLUSTER NUISANCE PRIORS (second set, see README) ------------------
  # ---------------------------------------------------------------------------------------
  roman_CL_LOGMMIN_1:
    prior:
      min: 11.2
      max: 13.4
    ref:
      dist: norm
      loc: 12.25
      scale: 0.15
    proposal: 0.1
    latex: \log M_{\mathrm{min},\mathrm{CL}}^1
  roman_CL_LOGMMIN_3:
    prior:
      min: 11.2
      max: 13.4
    ref:
      dist: norm
      loc: 12.25
      scale: 0.15
    proposal: 0.1
    latex: \log M_{\mathrm{min},\mathrm{CL}}^3
  roman_CL_LOGM20_1:
    prior:
      min: 14.0
      max: 15.2
    ref:
      dist: norm
      loc: 14.3
      scale: 0.1
    proposal: 0.1
    latex: \log M_{20,\mathrm{CL}}^1
  roman_CL_LOGM20_3:
    prior:
      min: 14.0
      max: 15.2
    ref:
      dist: norm
      loc: 14.3
      scale: 0.1
    proposal: 0.1
    latex: \log M_{20,\mathrm{CL}}^3
  roman_CL_ALPHA_1:
    prior:
      min: 0.5
      max: 2.5
    ref:
      dist: norm
      loc: 1.3
      scale: 0.1
    proposal: 0.1
    latex: \alpha_\mathrm{CL}^1
  roman_CL_ALPHA_3:
    prior:
      min: 0.5
      max: 2.5
    ref:
      dist: norm
      loc: 1.3
      scale: 0.1
    proposal: 0.1
    latex: \alpha_\mathrm{CL}^3
  # ---------------------------------------------------------------------------------------
  # ------------------------------------- DERIVED PARAMETERS ------------------------------
  # ---------------------------------------------------------------------------------------
  omegam:
    latex: \Omega_\mathrm{m}
  omegab:
    derived: 'lambda omegabh2, H0: omegabh2/((H0/100)**2)'
    latex: \Omega_\mathrm{b}
  sigma8:
    latex: \sigma_8
  S8:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: S_8

theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      lens_potential_accuracy: 1.0
      dark_energy_model: ppf
      kmax: 7.5

sampler:
  mcmc:
    covmat:
    covmat_params:
    learn_proposal: True
    learn_proposal_Rminus1_min: 0.03
    learn_proposal_Rminus1_max: 150
    learn_proposal_Rminus1_max_early: 300.
    max_samples: .inf
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    measure_speeds: False
    drag: False
    learn_every: 10d
    max_tries: .inf
    burn_in: 0
    Rminus1_single_split: 4

output: ./projects/roman_real/chains/EXAMPLE_MCMC_CLUSTER_LENSING2
